# RippleBot — VM deployment (mirrors infosec-tool's compose).
# The GitHub Action rewrites the `image:` tag to the freshly-pushed digest, then
# runs `docker compose up -d --no-build` on the VM.
#
# DEFAULT: embedded ChromaDB in a named volume (VECTOR_BACKEND=chroma) — simplest,
# data stays on the VM, exactly like infosec-tool. To switch to Postgres+pgvector
# later, uncomment the `postgres` service, set VECTOR_BACKEND=pgvector and
# POSTGRES_URI=postgresql://ripplebot:...@postgres:5432/ripplebot in .env.
services:
  app:
    image: asia-south1-docker.pkg.dev/standalone-tools-491412/tools/ripplebot:latest   # rewritten to :<sha> by the deploy job
    ports:
      - "8000:8000"                              # VM nginx proxies subdomain → :8000
    env_file:
      - .env                                     # managed on the VM (DevOps)
    volumes:
      - ripplebot-data:/app/data                 # Chroma vectors + uploads + SQLite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Optional: Postgres + pgvector (uncomment to use instead of Chroma) ────────
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     POSTGRES_USER: ripplebot
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ripplebot
  #   volumes:
  #     - ripplebot-pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  ripplebot-data:
  # ripplebot-pgdata:

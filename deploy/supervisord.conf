; RippleBot container process orchestration.
; Runs the FastAPI backend, the TanStack SSR frontend, and the internal nginx that
; unifies them on :8000. If any process dies, supervisord restarts it.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:backend]
; FastAPI/uvicorn on 127.0.0.1:8001 (PORT env). Serves /api/*.
command=python -m uvicorn backend.src.main:app --host 127.0.0.1 --port 8001
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
; TanStack SSR (Nitro node-server output) on 127.0.0.1:3000. Serves the UI.
command=node /app/frontend/.output/server/index.mjs
directory=/app
environment=PORT="3000",HOST="127.0.0.1"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; Internal reverse proxy on :8000 → /api → backend, / → frontend.
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# VM-level nginx snippet (add to the shared reverse proxy, same pattern as
# infosec-tool). TLS terminates at the GCP Load Balancer, so this stays HTTP.
# The LB forwards to the VM; nginx routes the RippleBot subdomain → container:8000.
server {
    listen 80;
    server_name chatbot.ripplehire.com;   # ← your subdomain / LB backend host

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE streaming
        proxy_read_timeout 600s;      # long agentic responses
        client_max_body_size 50M;     # document uploads
    }
}

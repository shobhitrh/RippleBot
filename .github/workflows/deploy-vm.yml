name: Build & Deploy (VM)

# Builds the RippleBot image, pushes to GCP Artifact Registry, and SSH-deploys to
# the VM. Mirrors trampolinetech/infosec-tool's deploy.yml (GCP SA auth → AR → SSH
# deploy with prune → pull → compose up → verify → health-poll).
#
# TODO before first run: set GCP_PROJECT below, and add repo secrets:
#   GCP_SA_KEY   – service-account JSON with Artifact Registry write + (deploy) read
#   VM_HOST, VM_USER, VM_SSH_KEY – SSH deploy target

on:
  # Manual-only until the VM + GCP secrets are set up (GCP_SA_KEY, VM_HOST, VM_USER,
  # VM_SSH_KEY). Auto-deploy on push would just fail on every commit until then.
  # Once the infra is ready, uncomment the push trigger below to deploy on merge.
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  REGION: asia-south1
  GCP_PROJECT: standalone-tools-491412        # ← set to RippleBot's GCP project
  IMAGE: asia-south1-docker.pkg.dev/standalone-tools-491412/tools/ripplebot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ship only the compose file; the .env is managed on the VM by DevOps.
      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml"
          target: /opt/ripplebot/

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_IMAGE: asia-south1-docker.pkg.dev/standalone-tools-491412/tools/ripplebot:${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_IMAGE
          script: |
            set -e
            # VM authenticates to Artifact Registry via its own GCP service account.
            gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

            # Reclaim disk before pulling a multi-GB image (infosec-tool lesson):
            docker image prune -af || true
            docker container prune -f || true
            docker builder prune -af || true

            docker pull "$DEPLOY_IMAGE"
            cd /opt/ripplebot
            sed -i "s|image: .*ripplebot.*|image: $DEPLOY_IMAGE|" docker-compose.yml
            docker compose up -d --no-build
            docker compose ps

            # Fail loudly if the running image isn't the one we just deployed.
            sleep 5
            RUNNING=$(docker inspect --format='{{.Config.Image}}' ripplebot-app-1 || echo none)
            echo "Running: $RUNNING  |  Target: $DEPLOY_IMAGE"
            [ "$RUNNING" = "$DEPLOY_IMAGE" ] || { echo "Deploy mismatch"; docker compose logs --tail=50; exit 1; }

            # Poll health (cold start loads Chroma + engine) up to 120s.
            for i in $(seq 1 24); do
              curl -sf http://localhost:8000/api/health >/dev/null && { echo "Healthy at $((i*5))s"; exit 0; }
              sleep 5
            done
            echo "Health check failed"; docker compose logs --tail=100; exit 1

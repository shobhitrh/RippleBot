name: Build & Deploy (VM)

# Builds the RippleBot image, pushes to GitHub Container Registry (GHCR), and
# SSH-deploys to the VM. No GCP project needed: CI push uses the built-in
# GITHUB_TOKEN; the VM pulls with a GHCR PAT.
#
# Manual-only until the VM + secrets are set up (VM_HOST, VM_USER, VM_SSH_KEY,
# GHCR_PAT). Once the infra is ready, uncomment the push trigger to deploy on merge.

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ripplebot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR via the built-in token
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ship only the compose file; the .env is managed on the VM by DevOps.
      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml"
          target: /opt/ripplebot/

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_IMAGE: ghcr.io/${{ github.repository_owner }}/ripplebot:${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_IMAGE
          script: |
            set -e
            # Authenticate the VM to GHCR (PAT with read:packages, stored as a secret).
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Reclaim disk before pulling a multi-GB image (infosec-tool lesson):
            docker image prune -af || true
            docker container prune -f || true
            docker builder prune -af || true

            docker pull "$DEPLOY_IMAGE"
            cd /opt/ripplebot
            sed -i "s|image: .*ripplebot.*|image: $DEPLOY_IMAGE|" docker-compose.yml
            docker compose up -d --no-build
            docker compose ps

            # Fail loudly if the running image isn't the one we just deployed.
            sleep 5
            RUNNING=$(docker inspect --format='{{.Config.Image}}' ripplebot-app-1 || echo none)
            echo "Running: $RUNNING  |  Target: $DEPLOY_IMAGE"
            [ "$RUNNING" = "$DEPLOY_IMAGE" ] || { echo "Deploy mismatch"; docker compose logs --tail=50; exit 1; }

            # Poll health (cold start loads Chroma + engine) up to 120s.
            for i in $(seq 1 24); do
              curl -sf http://localhost:8000/api/health >/dev/null && { echo "Healthy at $((i*5))s"; exit 0; }
              sleep 5
            done
            echo "Health check failed"; docker compose logs --tail=100; exit 1

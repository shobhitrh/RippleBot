# In-CONTAINER nginx: unifies backend + SSR frontend on one port (8000).
# The VM's shared nginx proxies subdomain → container:8000; this splits the traffic.
events { worker_connections 1024; }

http {
    # SSE (chat streaming) must not be buffered.
    proxy_http_version 1.1;
    proxy_buffering off;
    client_max_body_size 50M;

    upstream backend  { server 127.0.0.1:8001; }
    upstream frontend { server 127.0.0.1:3000; }

    server {
        listen 8000;

        # API + health → FastAPI
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;   # long-lived agentic SSE streams
        }

        # Everything else → SSR frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
